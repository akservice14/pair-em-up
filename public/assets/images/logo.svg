<svg viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background subtle grid pattern -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D3748;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Grid with paired numbers -->
  <g transform="translate(15, 10)">
    <!-- Grid squares -->
    <rect x="0" y="0" width="18" height="18" fill="none" stroke="#4299E1" stroke-width="2" rx="2"/>
    <rect x="22" y="0" width="18" height="18" fill="none" stroke="#4299E1" stroke-width="2" rx="2"/>
    <rect x="0" y="22" width="18" height="18" fill="none" stroke="#4299E1" stroke-width="2" rx="2"/>
    <rect x="22" y="22" width="18" height="18" fill="none" stroke="#4299E1" stroke-width="2" rx="2"/>
    
    <!-- Numbers -->
    <text x="9" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4299E1">3</text>
    <text x="31" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#48BB78">5</text>
    <text x="9" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#48BB78">5</text>
    <text x="31" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4299E1">3</text>
    
    <!-- Connection lines showing pairs -->
    <path d="M 9 15 Q 20 20 31 15" stroke="#ED8936" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 9 32 Q 20 27 31 32" stroke="#9F7AEA" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Game Title -->
  <text x="75" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="url(#gradient1)">PairEm Up</text>
</svg>